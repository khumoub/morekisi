# Morekisi, running locally with Docker: a minimal Supabase (database, sign-in, database API)
# plus the app with live reload.
#
#   docker compose up            → app at http://localhost:3000 (first start takes a few minutes)
#   docker compose down          → stop (data is kept)
#   docker compose down -v       → stop and delete local data (demo shop is recreated next time)
#
# Sign in with 71 234 567 (owner) or 71 234 568 (staff); the code is always 123456.
# Optional: put AI keys etc. in .env.local — it's passed to the app (see .env.example).

name: morekisi

x-local: &local
  env_file: docker/local.env

services:
  db:
    <<: *local
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/99-morekisi.sql:/docker-entrypoint-initdb.d/init-scripts/99-morekisi.sql:ro
    ports:
      # For database tools (user postgres, password in docker/local.env). Change with MOREKISI_DB_PORT.
      - "${MOREKISI_DB_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: docker/local.env
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:8000/auth/v1
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:morekisi-local-postgres@db:5432/postgres
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # Deprecated in GoTrue's log, but still what puts role=authenticated in user tokens (needed by PostgREST)
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      # Phone sign-in with fixed test codes — no SMS provider is ever called for these numbers.
      GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_SMS_OTP_EXP: 600
      # Local only: allow requesting codes repeatedly while testing
      GOTRUE_SMS_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_SMS_SENT: 1000
      GOTRUE_RATE_LIMIT_VERIFY: 1000
      GOTRUE_SMS_TEST_OTP: "26771234567:123456,26771234568:123456,26771234569:123456"
      GOTRUE_SMS_PROVIDER: twilio
      GOTRUE_SMS_TWILIO_ACCOUNT_SID: local-not-used
      GOTRUE_SMS_TWILIO_AUTH_TOKEN: local-not-used
      GOTRUE_SMS_TWILIO_MESSAGE_SERVICE_SID: local-not-used
    command: ["sh", "-c", "GOTRUE_JWT_SECRET=$$JWT_SECRET exec auth"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:morekisi-local-postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: morekisi-local-dev-jwt-secret-not-for-production-0001
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: morekisi-local-dev-jwt-secret-not-for-production-0001

  migrate:
    <<: *local
    image: supabase/postgres:15.8.1.060
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/migrate.sh"]
    volumes:
      - ./docker/migrate.sh:/migrate.sh:ro
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed.sql:/seed.sql:ro
    restart: "no"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - auth
      - rest
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:8000" # Supabase API (what NEXT_PUBLIC_SUPABASE_URL points to)
      - "3000:3000" # the app (it shares this container's network, see below)

  app:
    image: node:22-bookworm-slim
    working_dir: /app
    # Shares the gateway's network, so "localhost:8000" means the same thing to the app's server
    # code as it does to your browser.
    network_mode: "service:gateway"
    depends_on:
      rest:
        condition: service_started
    env_file:
      - path: docker/local.env
      - path: .env.local
        required: false
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
      WHATSAPP_VERIFY_TOKEN: local-verify-token
      WHATSAPP_APP_SECRET: local-app-secret
      WATCHPACK_POLLING: "true" # reliable live reload on Docker Desktop (Mac/Windows)
      NEXT_TELEMETRY_DISABLED: "1"
      MOREKISI_SIMULATOR: "true" # dashboard → Chat simulator (local only)
    command:
      - sh
      - -c
      - |
        export NEXT_PUBLIC_SUPABASE_ANON_KEY="$$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$$SERVICE_ROLE_KEY"
        [ -f node_modules/.package-lock.json ] && cmp -s package-lock.json node_modules/.morekisi-lock || { npm ci && cp package-lock.json node_modules/.morekisi-lock; }
        exec npx next dev -H 0.0.0.0 -p 3000
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules # Linux packages, separate from any on your computer
      - app-next:/app/.next

volumes:
  db-data:
  app-node-modules:
  app-next:
