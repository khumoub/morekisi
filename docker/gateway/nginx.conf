# One address (http://localhost:8000) for the app and the browser, laid out like Supabase:
#   /auth/v1/*  → GoTrue (sign-in)      /rest/v1/*  → PostgREST (database API)
# Like Supabase's own gateway, it answers browser CORS checks for every service.
server {
  listen 8000;
  client_max_body_size 20m;

  # Same CORS headers for every response (upstream ones are dropped to avoid duplicates)
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Expose-Headers;
  add_header Access-Control-Allow-Origin $http_origin always;
  add_header Access-Control-Allow-Credentials true always;
  add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, prefer, range, accept-profile, content-profile" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Expose-Headers "content-range, x-total-count, x-supabase-api-version" always;

  location /auth/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /rest/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  location = / {
    default_type text/plain;
    return 200 "Morekisi local Supabase gateway. The app is at http://localhost:3000\n";
  }
}
